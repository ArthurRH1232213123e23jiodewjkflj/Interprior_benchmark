#            physics comes from those defaults. Freezing the resolved result
#            keeps this file self-contained and hashable.
# env code : /home/zhangjiawei/Interprior  (255eade8)
#
# HOW IT DIFFERS FROM THE DATA-PRODUCTION PROFILE (28 gate fields compared):
#   assets.robot_self_collision_enabled          data True -> false   REAL PHYSICS
#   assets.object_missing_inertial_density_kg_m3 data 200.0 -> None   REAL PHYSICS
