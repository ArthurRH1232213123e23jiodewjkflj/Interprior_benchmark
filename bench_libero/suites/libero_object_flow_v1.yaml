# HAND-MAINTAINED. (Corrected 2026-09-06: this line used to claim the file was
# GENERATED by tasks/libero/build_env/build_env_dirs.py and must not be hand-edited.
# That was false -- no script in this repo writes this file. build_env_dirs.py emits
# envs/*/env.yaml, env_registry.json, cases.json and reachability_report.json, and
# nothing else. Edit this file directly; there is no generator to re-run.)
#
# The env/case index it consumes IS generated, though: regenerate that with
# build_env_dirs.py + build_object_urdf.py, then re-verify. See tasks/libero/STRUCTURE.md.
#
# LIBERO object-flow, one case per trajectory. An ENV is an object asset:
# tasks/libero/envs/<env_id>/ holds the mesh + its 16 canonical points, and
# 22 such directories cover all 130 LIBERO trajectories.
#
# WHY 22 AND NOT 130 (measured, not assumed):
#   * The pointflow pipeline already rebases each task's support height into
#     goal_traj. floor/low_table/table differ by 0.87 m in WORLD frame but all
#     land at base-frame z0 0.005-0.046 m -- "object resting on the table".
#     So support surface and z0 are NOT env axes; one table height serves all.
#   * 22 mesh basenames, each with exactly ONE sha256 across all 130 tasks.
#   * points_obj is bit-identical across every task sharing an env (43 for the
#     bowl). Surface points depend on the asset, not the trajectory.
#   * new_salad_dressing and salad_dressing are byte-identical meshes: 21
#     distinct geometries under 22 names.
#   * akita_black_bowl_{1,2,3} / butter_{1,2} / yellow_book_{1,2} are scene
#     instances of one asset, not separate objects.
#
# WIRED, BUT NEVER ROLLED OUT. (Corrected 2026-09-06: this block used to say
# "NOT YET RUNNABLE -- driver.py has zero handling for goal_source: authored_npz".
# The wiring landed 2026-09-01 20:52, after this header was written at 19:05:
# driver.py:222 branches on authored_npz and driver.py:158 imports
# build_authored_episode from envs/authored_episode.py. Commits a80df18, 9f65a61.)
#
# What is still true, and is NOT a wiring gap:
#   * No rollout has ever been run. verify_env_dirs.py passing is a static check.
#     Run ONE case as an infrastructure gate before the full 95.
#   * The donor cube is 0.06 m; these objects are 0.077-0.354 m. authored_episode.py
#     synthesises an episode from a donor shard whose canonical cloud is that cube.
#     Exact for authored cube paths, NOT exact here, and never measured. Measure
#     before trusting any number.
#   * LIBERO ships no robot joint data at all (Franka + gripper vs our xArm7 + Wuji
#     27 DoF), so a teacher replay is structurally impossible -- meaning the replay
#     gate, the thing that separates "platform broken" from "policy bad", does not
#     exist on LIBERO at all.
#
# METRICS CHANGE MEANING. guide_tracking_* and demo_success normally compare
# against a teacher recording. With authored goals the same formulas measure
# agreement with a target path: 'did it follow', not 'did it reproduce'. These
# results must never be averaged in with the held-out shard numbers.

name: libero_object_flow_v1
task: cube_lift_follow_v1
description: >
  95 LIBERO object-flow trajectories over 21 object envs. Each case starts
  with the object resting where its trajectory begins -- NOT pre-grasped -- and
  hands the policy that trajectory's whole object-flow plan at reset. The policy
  must grasp the object itself and then follow the path.

physics_profile: tro_mp_dataprod_venvshare_20260808.yaml
interprior_root: /mnt/venv_share/H800/Interprior

goal_source: authored_npz
envs_dir: tasks/libero/envs

# Robot, table and the canonical point cloud come from a real cube shard; only
# the object trajectory is LIBERO's. Same donor as the authored cube suite.
donor_shard: /mnt/zuoyufan/tro_output/runs/20260818/4gpu_10k_env_2ep_20260818_174153_batch01_gpu4/runs/4gpu_10k_env_2ep_20260818_174153_batch01_gpu4_postprocess/derived/success/shards/derived_000427
donor_slot: 2

start_frame: 0
plan_source_start: 0
max_frames: 457
post_plan_frames: 0

cases_from: ../tasks/libero/cases.json
limit: 8
