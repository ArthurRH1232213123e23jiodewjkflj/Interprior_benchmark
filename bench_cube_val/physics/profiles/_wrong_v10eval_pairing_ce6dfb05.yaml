# Isolated TRO + motion-planning data-collection overlay.  This file inherits
# typed defaults from TroMpEnvCfg and leaves SimToolReal untouched.

scene:
  num_envs: 1

# PhysX contact/articulation budget for TRO-MP. The Robot requests 16/0 and
# PhysX clamps that request to the scene-wide ranges below.
sim:
  physx:
    min_position_iteration_count: 8
    max_position_iteration_count: 64
    min_velocity_iteration_count: 0
    max_velocity_iteration_count: 0
    robot_solver_position_iterations: 16
    robot_solver_velocity_iterations: 0

# Isolated TRO-MP collection runs for 40 s: 2400 policy/control steps at 60 Hz
# produce 2400 retained frames at the collector's 60 Hz cadence.
episode_length_s: 40.0

termination:
  episode_length: 2400

assets:
  object_urdf: "assets/urdf/cube_0p06m.urdf"
  object_scale: [1.0, 1.0, 1.0]
  # Physical collision bbox used by table_contact_bbox reset; independent of
  # TRO/policy normalization and of all reward configuration.
  object_size_m: [0.06, 0.06, 0.06]
  cube_sampling_mode: fixed
  # TRO-MP deliberately disables all robot self-collision pairs.
  robot_self_collision_enabled: false

reset:
  fixed_start_pose: null
  object_reset_center_xy: [0.45, 0.0]
  object_reset_range_xy: [0.15, 0.15]
  object_reset_z_mode: table_contact_bbox
  # yaw_only belongs to object reset only.  TRO-MP ee targets use full random
  # orientation through the isolated sampler.
  object_reset_orientation_mode: yaw_only
  reset_position_noise_z: 0.0
  table_contact_margin: 0.002

tro_mp:

  # ===========================[Grasp Buffer & Runtime]===========================
  grasp_buffer_path: "isaacsimenvs/tasks/tro_mp/grasp_buffers/cube_num1/idx0/idx0_520/cube_0p06m_wuji_tro.npz"
  grasp_metadata_path: "isaacsimenvs/tasks/tro_mp/grasp_buffers/cube_num1/idx0/idx0_520/cube_0p06m_wuji_tro.json"
  grasp_source_mode: offline_buffer  # offline_buffer | online_tro
  # Fixed reset-time PhysX settle; recorded under the existing reset phase.
  reset_settle_time_s: 2.00
  # online_tro uses settled Isaac oracle geometry in each env-local table frame.
  # offline_num_grasp_pose selects this many buffer candidates. Choose either
  # score-descending Top-K or deterministic per-env random sampling.
  offline_num_grasp_pose: 16
  offline_grasp_pose_selection: top_k  # top_k | random
  online_tro_input_mode: oracle_geometry
  # TRO-online generates this many candidates; all valid returned candidates
  # are passed to synchronized pregrasp IK screening.
  online_num_grasp_pose: 8
  online_tro_env_batch_max_size: 1
  online_tro_num_multistart: 8
  online_tro_config_path: "policy/TRO/config/infer_wuji_sim.yaml"
  online_tro_checkpoint_path: "policy/TRO/ckpt/tro_wuji/step_975000.pth"
  online_tro_object_surface_seed: 42
  online_tro_table_surface_seed: 43

  # =======================[Execution & Parallel Scheduler]=======================
  execution_mode: gpu_vectorized
  # ``--num-envs`` selects the actual scene size. This is the recommended
  # default for the first real parallel rollout.
  parallel_num_envs: 4
  per_env_reset: true
  # Reset only envs that completed this scheduler tick in one vectorized call.
  # legacy_per_env retains the prior exact one-env-at-a-time RNG behavior.
  reset_rng_mode: batched_deterministic

  # ===========================[IK Planner & Profiling]============================
  # No collision checking. Select ``differential_ik`` (direct target DLS),
  # ``cartesian_differential_ik`` (Cartesian interpolation + DLS), or
  # ``ik_joint_trajectory`` (q_goal then joint-space interpolation).
  planner_backend: ik_joint_trajectory
  gpu_ik_device: ""  # empty = simulator --device; a different device is invalid
  gpu_ik_batch_max_size: 8
  gpu_ik_dtype: float32
  # Strict phase barriers maximize stable IK cohort size. Before any physical
  # pregrasp motion, each env screens all source-selected candidates; it picks
  # its earliest viable one, while an all-failed env enters fail_hold.
  ik_scheduler_mode: synchronized_epoch  # async | synchronized_epoch
  # Cartesian mode uses ceil(current-to-goal translation / spacing), with a
  # minimum of 60 control waypoints (1.0 s at the 60 Hz control cadence).
  cartesian_differential_min_steps: 60
  cartesian_differential_waypoint_spacing_m: 0.004
  joint_trajectory_profile: quintic  # linear | quintic
  ik_interpolation_dt_s: 0.016666666666666666
  ik_max_joint_velocity_rad_s: 0.8
  ik_min_trajectory_duration_s: 1.00
  # Validated Phase-45 operating point: preserves the tested grasp quality
  # while avoiding the former 320-iteration fixed DLS budget.
  ik_max_iterations: 90
  ik_position_tolerance_m: 0.008
  ik_orientation_tolerance_rad: 0.08
  differential_position_gain: 1.0
  differential_orientation_gain: 0.65
  differential_damping: 0.04
  differential_max_joint_step_rad: 0.035
  # IK debug artifacts are opt-in. Production/default rollouts do not write
  # wave JSONL records or solver-input traces.
  ik_profile_enabled: false
  ik_active_set_mode: masked
  # Optional bounded offline replay trace. It intentionally adds D2H and is
  # disabled for production rollouts.
  ik_trace_capture: false
  ik_trace_max_rows: 65536

  # =========================[Recording, Output & Viewer]==========================
  record_output_dir: "outputs/tro_mp"
  record_hz: 60
  # CPU writer threads receive completed episodes through a byte-bounded queue.
  # The scheduler only blocks when this bound is exhausted; artifacts remain
  # compatible with the existing trajectory.npz + manifest.json viewers.
  output_mode: episode_npz_async
  writer_processes: 2
  writer_queue_max_bytes: 2147483648  # 2 GiB of raw recorder payload
  output_compression: npz             # npz | none
  # For large data collection set output_mode: shard and writer_processes: 1.
  # One committed shard contains at most this many fixed-length episode rows.
  shard_episode_capacity: 256
  shard_max_frames: 2400
  # Default record path uses a two-slot CUDA->pinned-host ring and only waits
  # when both slots are still in flight.
  gpu_record_ring_enabled: true
  pinned_record_slots: 2
  # HTML is written only under one run's ``visualize/`` directory.  env 0's
  # Raw capture is not rendered directly. First derive robot-base v4 data
  # with postprocess_tro_mp_record.sh, then invoke episode_to_html.py.
  visualization_enabled: false
  visualization_env_ids: [0]
  visualization_every_n_env0_episodes: 10

  # ===========================[TRO Grasp Execution]===============================
  settle_time_s: 0.50
  tro_hand_transition_time_s: 1.00
  hand_closure_mode: direct_squeeze  # direct_squeeze | tro_then_squeeze
  squeeze_time_s: 0.75
  pregrasp_offset_m: 0.12
  grasp_execution_offset_m: 0.00
  # Preserve grasp XY/orientation and vertically lift link7 to at least this
  # height above the table before any random EE-goal sampling.
  post_grasp_lift_height_above_table_m: 0.20
  # Cube held/lifted criterion: reset cube z + 2 cm.
  cube_lift_height_threshold_m: 0.02
  conservative_closure_fraction: 0.60
  squeeze_fraction: 0.60

  # ===========================[EE-Goal Sampling & Arrival]=========================
  max_goal_sampling_attempts: 32
  continue_ee_sampling_until_episode_limit: true
  # First goal is expressed in the xArm base frame: +x forward, +y left,
  # +z up. It is a conservative annular workspace, not a reach-limit box.
  ee_target_volume_mins: [0.25, -0.28, 0.0]
  ee_target_volume_maxs: [0.60, 0.28, 2.0]
  ee_target_volume_region_scale: 1.0
  ee_goal_radial_min_m: 0.30
  ee_goal_radial_max_m: 0.65
  # First-goal link7 height is table top + [25, 50] cm; runtime additionally
  # enforces held-hand/cube clearance after table-pose randomization.
  ee_goal_table_relative_z_min_m: 0.25
  ee_goal_table_relative_z_max_m: 0.50
  # Every later goal is sampled around the previous accepted goal in base XYZ,
  # then rejected if it leaves the global annulus or table-clearance band.
  ee_goal_relative_position_delta_mins: [-0.08, -0.08, -0.07]
  ee_goal_relative_position_delta_maxs: [0.08, 0.08, 0.07]
  table_surface_z_offset_m: 0.15
  ee_goal_hand_envelope_radius_m: 0.18
  ee_goal_held_cube_bounding_radius_m: 0.052
  ee_goal_table_clearance_margin_m: 0.018
  # Arbitrary-axis SO(3) perturbations, not yaw-only: +/- 30 degrees.
  ee_goal_first_max_rotation_rad: 0.5235987755982988
  ee_goal_relative_max_rotation_rad: 0.5235987755982988
  # A collection is valid only if the physical Isaac link7 body reaches its
  # target. Pregrasp/grasp are checked before hand lock; lift and all later
  # EE-goal following are checked with the post-hand-lock pair.
  pre_hand_lock_arrival_position_tolerance_m: 0.01
  pre_hand_lock_arrival_orientation_tolerance_rad: 0.10
  post_hand_lock_arrival_position_tolerance_m: 0.05
  post_hand_lock_arrival_orientation_tolerance_rad: 0.25
